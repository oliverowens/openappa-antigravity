# OpenAPPA Security Policy for Antigravity Agent
#
# Rules are evaluated top-down; the first matching rule takes precedence.
# Untrusted inputs (such as web fetches) lower trajectory trust to 'suspicious'.
# Sensitive credential reads narrow trajectory audience to 'self'.
# Dangerous tools (such as run_command, file writes) require 'trusted' trust.
# Outbound network requests require 'public' audience (preventing exfiltration).

[policy]
version = 2
description = "Antigravity OpenAPPA Information-Flow Control Policy"
# Battery inclusion: compose with external OpenAPPA marketplace batteries
include = []


# ==============================================================================
# Governance & External Services
# ==============================================================================

[policy.hitl]
# Mode for remedy approvals: "chat" (default interactive prompt), "slack", "pagerduty", "cli"
mode = "chat"
prompt_user = true

[policy.classification]
# Policy classification engine: "local" (default pattern heuristic), "llm_guardrails"
mode = "local"

[policy.sanitizers.redact-secrets]
engine = "builtin-regex"
# Note on limitations: Built-in regex matches structured credentials, private keys,
# AWS/GitHub/Bearer tokens, and key-value assignments. Unstructured or custom
# high-entropy secrets without standard keywords require an external DLP service.

[policy.directory]
# Directory provider: "planned" (Future feature: GitHub Org / Okta / SCIM sync)
provider = "none"
status = "planned"

[policy.audit]
# Toggle caching/storing OpenAPPA decisions in the active workspace
enabled = true
# Folder name located inside the active workspace
dir = ".appa_audit"
# Format: "jsonl" (deterministic, compatible with `appa replay`)
format = "jsonl"
# Generate human-readable session summary in Markdown alongside JSONL
generate_markdown = true
# Mask credentials, tokens, and keys in logged argument traces
mask_secrets = true

# ==============================================================================
# Boundaries & Allowlist
# ==============================================================================

[policy.boundaries]
# Restricts write operations to the active workspace / git project directory
workspace_only = true
# Optional custom paths allowed outside workspace
allowed_external_paths = []

[policy.network]
# Outbound URLs matching trusted_domains preserve 'trusted' trajectory trust.
# Any URL outside this list degrades trust to 'suspicious'.
trusted_domains = [
    "github.com",
    "raw.githubusercontent.com",
    "api.github.com",
    "pypi.org",
    "docs.python.org"
]

[policy.subagents]
# Subagents default to quarantined research mode:
# - Allowed: view_file, search_web, read_url_content
# - Blocked by default: run_command, write_to_file, replace_file_content
default_role = "research"
allow_execution = false
allow_writes = false

# ==============================================================================
# 1. Shell Command Execution (run_command)
# ==============================================================================

# Commands accessing sensitive credentials or secret stores narrow audience to 'self'
[[policy.tool]]
name = "host/antigravity/run_command(command:*.env*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "host/antigravity/run_command(command:*.ssh/*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "host/antigravity/run_command(command:*.aws/*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "host/antigravity/run_command(command:*token*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "host/antigravity/run_command(command:*id_rsa*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "host/antigravity/run_command(command:*id_ed25519*)"
delta = { audience = ["self"] }
tags = ["credentials"]

# General shell execution requires trusted data (stops prompt injection from web content)
[[policy.tool]]
name = "host/antigravity/run_command"
requires = { trust = "trusted" }
delta = {}
description = "Executes arbitrary shell commands; requires trusted trajectory."

# ==============================================================================
# 2. File Reading (view_file)
# ==============================================================================

# Reading sensitive files narrows audience to 'self'
[[policy.tool]]
name = "host/antigravity/view_file(path:*.env*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "host/antigravity/view_file(path:*.ssh/*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "host/antigravity/view_file(path:*.aws/*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "host/antigravity/view_file(path:*token*)"
delta = { audience = ["self"] }
tags = ["credentials"]

# General file reading leaves audience unchanged, preserves trust
[[policy.tool]]
name = "host/antigravity/view_file"
delta = {}
description = "Reads files within the repository/workspace."

# ==============================================================================
# 3. File Writing & Modifications (write_to_file, replace_file_content)
# ==============================================================================

[[policy.tool]]
name = "host/antigravity/write_to_file"
requires = { trust = "trusted" }
delta = {}
description = "Writes new files or overwrites existing files within workspace."

[[policy.tool]]
name = "host/antigravity/replace_file_content"
requires = { trust = "trusted" }
delta = {}
description = "Edits contiguous lines in existing files within workspace."

# ==============================================================================
# 4. Web Fetch & Search (read_url_content, search_web)
# ==============================================================================

# Trusted domains: preserve 'trusted' trust
[[policy.tool]]
name = "host/antigravity/read_url_content(url:*github.com/*)"
requires = { audience = { contains = ["public"] } }
delta = {}
description = "Fetches content from trusted github.com domain (preserves trusted status)."

[[policy.tool]]
name = "host/antigravity/read_url_content(url:*docs.python.org/*)"
requires = { audience = { contains = ["public"] } }
delta = {}
description = "Fetches content from trusted docs.python.org domain (preserves trusted status)."

[[policy.tool]]
name = "host/antigravity/read_url_content(url:*pypi.org/*)"
requires = { audience = { contains = ["public"] } }
delta = {}
description = "Fetches content from trusted pypi.org domain (preserves trusted status)."

# General web fetch: degrades trajectory trust to 'suspicious'
[[policy.tool]]
name = "host/antigravity/read_url_content"
requires = { audience = { contains = ["public"] } }
delta = { trust = "suspicious" }
description = "Fetches external web content over HTTP; degrades trust to suspicious."

[[policy.tool]]
name = "host/antigravity/search_web"
requires = { audience = { contains = ["public"] } }
delta = { trust = "suspicious" }
description = "Performs web search queries; degrades trust to suspicious."

# ==============================================================================
# 5. Subagents (invoke_subagent)
# ==============================================================================

[[policy.tool]]
name = "host/antigravity/invoke_subagent"
delta = {}
description = "Spawns child subagents with quarantined trajectory context."

[[policy.tool]]
name = "host/antigravity/send_message"
requires = { trust = "trusted" }
delta = {}
description = "Sends inter-agent messages; requires trusted trajectory."

[[policy.tool]]
name = "host/antigravity/manage_subagents"
requires = { trust = "trusted" }
delta = {}
description = "Lists or manages running subagents; requires trusted trajectory."

[[policy.tool]]
name = "host/antigravity/define_subagent"
requires = { trust = "trusted" }
delta = {}
description = "Defines new subagent roles; requires trusted trajectory."

# ==============================================================================
# 6. Interactive & Lifecycle Tools (ask_question, manage_task, schedule, generate_image)
# ==============================================================================

[[policy.tool]]
name = "host/antigravity/ask_question"
requires = { trust = "trusted" }
delta = {}
description = "Interactive human-in-the-loop prompt; requires trusted trajectory to prevent prompt injection spoofing."

[[policy.tool]]
name = "host/antigravity/manage_task"
requires = { trust = "trusted" }
delta = {}
description = "Inspects and manages background tasks; requires trusted trajectory."

[[policy.tool]]
name = "host/antigravity/schedule"
requires = { trust = "trusted" }
delta = {}
description = "Schedules one-shot or recurring background tasks; requires trusted trajectory."

[[policy.tool]]
name = "host/antigravity/generate_image"
requires = { trust = "trusted" }
delta = {}
description = "Generates UI mockup images; requires trusted trajectory."


# ==============================================================================
# 7. Remedy Control Tool (execute_remedy_plan)
# ==============================================================================

[[policy.tool]]
name = "mcp__appa__execute_remedy_plan"
delta = {}
description = "Applies approved remedy plans and authorizes retries."

[[policy.tool]]
name = "appa/execute_remedy_plan"
delta = {}
description = "Canonical remedy execution tool."

# ==============================================================================
# 8. Built-in Sanitizers
# ==============================================================================

[[policy.sanitizer]]
name = "redact-secrets"
on = ["tool_result"]
description = "Masks secrets and credentials in tool outputs, permitting audience upgrade from self to public."

[policy.sanitizer.redact-secrets.permits]
audience = { from = ["self"], to = ["public"] }

[[policy.sanitizer]]
name = "attest-schema"
on = ["child_end"]
description = "Validates subagent return values against JSON schema, permitting trust upgrade from suspicious to trusted."

[policy.sanitizer.attest-schema.permits]
trust = { from = "suspicious", to = "trusted" }

[externals]
timeout_ms = 3000
max_body_bytes = 65536
