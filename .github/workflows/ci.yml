name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint-workflows:
    name: Lint Workflows
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Run actionlint
      run: |
        bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
        ./actionlint -color

  test:
    name: Test & Verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies and build tools
      run: |
        python -m pip install --upgrade pip build
        pip install -e .

    - name: Run policy check (describe --check)
      run: |
        python appa.py describe --check

    - name: Run deterministic replay trace
      run: |
        python appa.py replay policy-tests/

    - name: Run unit test suite
      run: |
        python -m unittest tests/test_suite.py

    - name: Verify Semantic Versioning integrity
      run: |
        python scripts/release.py --verify

    - name: Verify package build
      run: |
        python -m build
